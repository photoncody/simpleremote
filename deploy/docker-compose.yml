# SimpleRemote with a TURN relay.
#
#   cp .env.example .env    # then edit it
#   docker compose up -d
#
# Put SimpleRemote behind a reverse proxy that terminates TLS (Caddy, Traefik,
# nginx) and forwards WebSockets. Set PUBLIC_URL to the https:// address.

services:
  simpleremote:
    image: ghcr.io/photoncody/simpleremote:latest
    # To build locally instead:
    # build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080" # expose through your reverse proxy
    volumes:
      - simpleremote-data:/data
      # Optional: serve your own (for example, code-signed) agent builds.
      # - ./agents:/app/agents:ro

  # TURN relay for connections where a direct path isn't possible (strict
  # NATs, corporate firewalls). Uses short-lived credentials signed with
  # TURN_SECRET, which SimpleRemote hands out per session.
  coturn:
    image: coturn/coturn:4.7
    restart: unless-stopped
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:?set TURN_SECRET in .env}
      - --realm=${TURN_REALM:-simpleremote}
      - --min-port=49160
      - --max-port=49250
      - --no-cli
      - --no-tls
      - --no-dtls
      - --no-multicast-peers
      # Don't let the relay reach private networks. Remove these lines only if
      # techs and users are on the same internal network as the server.
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=::1
      - --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

volumes:
  simpleremote-data:
